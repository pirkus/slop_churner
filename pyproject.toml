[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ralph"
version = "0.1.0"
description = "An autonomous implement -> test -> PR loop driven by a coding agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "h2>=4.0",
]

[project.scripts]
ralph = "ralph.cli:main"

[tool.setuptools]
packages = ["ralph"]

[tool.setuptools.package-data]
ralph = ["ui.html"]
