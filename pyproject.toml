[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slop-churner"
version = "0.1.0"
description = "An autonomous implement -> test -> PR loop driven by a coding agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "h2>=4.0",
]

[project.scripts]
slop-churner = "slop_churner.cli:main"

[tool.setuptools]
packages = ["slop_churner"]

[tool.setuptools.package-data]
slop_churner = ["ui.html"]
