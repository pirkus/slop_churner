<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slop-churner</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b23;
    --panel2: #1c2330;
    --border: #2a3342;
    --text: #d7dee8;
    --dim: #8a97a8;
    --accent: #5aa9ff;
    --green: #3fb96f;
    --red: #e5534b;
    --amber: #e0a63f;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 12px;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .5px; }
  header .tag { color: var(--dim); font-size: 13px; }
  header .db { margin-left: auto; color: var(--dim); font: 12px var(--mono); }
  main { display: grid; grid-template-columns: 380px 1fr; gap: 0; min-height: calc(100vh - 53px); }
  aside { border-right: 1px solid var(--border); background: var(--panel); padding: 16px; overflow-y: auto; max-height: calc(100vh - 53px); }
  section { padding: 16px 20px; overflow-y: auto; max-height: calc(100vh - 53px); }

  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); margin: 0 0 10px; }
  h2 + * { margin-top: 0; }

  label { display: block; font-size: 12px; color: var(--dim); margin: 10px 0 4px; }
  input[type=text], input[type=number], textarea, select {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; font: inherit;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { min-height: 74px; resize: vertical; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  details { margin-top: 10px; }
  details summary { cursor: pointer; color: var(--dim); font-size: 12px; user-select: none; }
  button {
    background: var(--accent); color: #06121f; border: 0; border-radius: 6px;
    padding: 8px 14px; font: 600 14px inherit; cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--border); font-weight: 400; padding: 4px 10px; font-size: 12px; }
  button.ghost:hover { color: var(--text); border-color: var(--dim); filter: none; }
  button.danger { background: var(--red); color: #fff; }
  .startrow { display: flex; gap: 8px; margin-top: 12px; }
  .startrow button { flex: 1; }
  .formerr { color: var(--red); font-size: 12px; margin-top: 8px; white-space: pre-wrap; min-height: 14px; }
  .formwarn { color: var(--amber); font-size: 12px; margin-top: 8px; white-space: pre-wrap; min-height: 14px; }
  .formhint { color: var(--dim); font-size: 11px; margin-top: 4px; }
  label.checklabel { display: flex; align-items: center; gap: 6px; cursor: pointer; }

  .runlist { margin-top: 22px; display: flex; flex-direction: column; gap: 8px; }
  .runitem {
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    cursor: pointer; background: var(--panel2);
  }
  .runitem:hover { border-color: var(--dim); }
  .runitem.active { border-color: var(--accent); }
  .runitem .top { display: flex; align-items: center; gap: 8px; }
  .runitem .prompt { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .runitem .meta { color: var(--dim); font-size: 12px; margin-top: 3px; display: flex; gap: 10px; }

  .pill {
    font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px;
    border: 1px solid; letter-spacing: .03em; white-space: nowrap;
  }
  .pill.pending, .pill.queued, .pill.cancelled { color: var(--dim); border-color: var(--dim); }
  .pill.planning, .pill.pr { color: var(--accent); border-color: var(--accent); }
  .pill.awaiting_approval { color: var(--amber); border-color: var(--amber); }
  .pill.awaiting_acceptance { color: #b085f5; border-color: #b085f5; }
  .pill.accepted { color: var(--green); border-color: var(--green); }
  .pill.rejected { color: var(--red); border-color: var(--red); }
  .pill.implementing, .pill.testing, .pill.fixing, .pill.running { color: var(--amber); border-color: var(--amber); }
  .pill.done { color: var(--green); border-color: var(--green); }
  .pill.failed, .pill.error { color: var(--red); border-color: var(--red); }
  body.live .pill.implementing, body.live .pill.testing, body.live .pill.fixing,
  body.live .pill.planning, body.live .pill.running { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }

  .empty { color: var(--dim); text-align: center; margin-top: 60px; }
  .runhead { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); padding: 14px 16px; margin-bottom: 16px; }
  .runhead .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .runhead .prompt { font-size: 16px; font-weight: 600; margin: 8px 0 4px; }
  .runhead .meta { color: var(--dim); font-size: 12px; font-family: var(--mono); display: flex; gap: 14px; flex-wrap: wrap; }
  .runhead .error { color: var(--red); margin-top: 8px; font-family: var(--mono); font-size: 13px; white-space: pre-wrap; }
  .runhead button { margin-left: auto; }

  .taskrow { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); margin-bottom: 10px; overflow: hidden; }
  .taskhead { display: flex; align-items: center; gap: 10px; padding: 11px 14px; cursor: pointer; }
  .taskhead:hover { background: var(--panel2); }
  .taskhead .tid { color: var(--dim); font-family: var(--mono); font-size: 12px; }
  .taskhead .title { font-weight: 600; flex: 1; }
  .taskhead .iter { color: var(--dim); font-size: 12px; font-family: var(--mono); }
  .taskhead .chev { color: var(--dim); transition: transform .15s; }
  .taskrow.open .chev { transform: rotate(90deg); }
  .taskdesc { padding: 0 14px 10px 14px; color: var(--dim); font-size: 13px; white-space: pre-wrap; }
  .taskerr { margin: 0 14px 10px; padding: 8px 10px; border: 1px solid var(--red); border-radius: 8px; color: var(--red); font-family: var(--mono); font-size: 12px; white-space: pre-wrap; max-height: 120px; overflow: auto; }
  .steps { border-top: 1px solid var(--border); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; background: #121722; }
  .step { border: 1px solid var(--border); border-radius: 8px; background: var(--panel2); }
  .steptop { display: flex; align-items: center; gap: 8px; padding: 7px 10px; }
  .steptop .stage { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; padding: 2px 8px; border-radius: 5px; background: var(--bg); border: 1px solid var(--border); }
  .steptop .iter { color: var(--dim); font-size: 12px; }
  .steptop .ok { margin-left: auto; font-weight: 700; font-size: 12px; }
  .steptop .ok.pass { color: var(--green); }
  .steptop .ok.fail { color: var(--red); }
  .steptop .dur { color: var(--dim); font-size: 11px; font-family: var(--mono); }
  pre.log {
    margin: 0; padding: 10px 12px; border-top: 1px solid var(--border);
    font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word;
    max-height: 320px; overflow: auto; color: #b9c4d4; background: var(--bg); border-radius: 0 0 8px 8px;
  }
  .nodetail { color: var(--dim); font-size: 13px; padding: 8px 2px; }
  .transcript { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .tstep { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); overflow: hidden; }
  .tstep.live { border-color: var(--accent); }
  .tstep .top { display: flex; align-items: center; gap: 8px; padding: 8px 12px; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  .tstep.live .top { color: var(--accent); }
  .tstep .top .who { margin-left: auto; color: var(--accent); font-family: var(--mono); text-transform: none; letter-spacing: 0; }
  .tstep pre { margin: 0; padding: 0 12px 10px; font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow: auto; color: #b9c4d4; background: var(--bg); }
  .retryrow { display: flex; gap: 8px; padding: 0 14px 12px; }

  /* diff review */
  .difftitle { font-weight: 600; margin-bottom: 6px; }
  .diffstat { color: var(--dim); font: 12px var(--mono); margin-bottom: 10px; }
  .diffstat b.add { color: var(--green); font-weight: 600; }
  .diffstat b.del { color: var(--red); font-weight: 600; }
  .diffrow { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); margin-bottom: 8px; overflow: hidden; }
  .diffhead { display: flex; align-items: center; gap: 10px; padding: 9px 12px; cursor: pointer; }
  .diffhead:hover { background: var(--panel2); }
  .diffhead .path { font: 13px var(--mono); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .diffhead .add { color: var(--green); font: 12px var(--mono); }
  .diffhead .del { color: var(--red); font: 12px var(--mono); }
  .diffhead .chev { color: var(--dim); transition: transform .15s; }
  .diffrow.open .chev { transform: rotate(90deg); }
  .diffpatch { border-top: 1px solid var(--border); margin: 0; padding: 8px 0; background: var(--bg); max-height: 420px; overflow: auto; }
  .diffpatch .dl { font: 12px/1.55 var(--mono); padding: 0 14px; white-space: pre; }
  .diffpatch .dl.add { background: rgba(63,185,111,.12); color: #8fd8a8; }
  .diffpatch .dl.del { background: rgba(229,83,75,.12); color: #e89a94; }
  .diffpatch .dl.hunk { color: var(--accent); background: rgba(90,169,255,.07); }
  .diffpatch .dl.meta { color: var(--dim); }

  .planrow { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); margin-bottom: 10px; padding: 10px 12px; }
  .planrow .top { display: flex; align-items: center; gap: 8px; }
  .planrow .num { color: var(--dim); font: 12px var(--mono); min-width: 24px; }
  .planrow .title { flex: 1; }
  .planrow .desc { margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>slop-churner</h1>
  <span class="tag">autonomous implement → test → PR loop</span>
  <span class="db" id="dbpath"></span>
</header>
<main>
  <aside>
    <h2>New run</h2>
    <form id="newrun">
      <label for="f-repo">repo</label>
      <input type="text" id="f-repo" value="." placeholder="/path/to/repo">
      <label for="f-prompt">prompt</label>
      <textarea id="f-prompt" required placeholder="What should slop-churner build?"></textarea>
      <details>
        <summary>parameters</summary>
        <div class="grid2">
          <div>
            <label for="f-base">base branch</label>
            <input type="text" id="f-base" placeholder="auto (current)">
          </div>
          <div>
            <label for="f-agent">agent</label>
            <input type="text" id="f-agent" value="pi">
          </div>
          <div>
            <label for="f-model">model</label>
            <input type="text" id="f-model" placeholder="optional">
          </div>
          <div>
            <label for="f-test">test cmd</label>
            <input type="text" id="f-test" placeholder="planner's choice">
          </div>
          <div>
            <label for="f-iter">max iterations</label>
            <input type="number" id="f-iter" value="3" min="1">
          </div>
          <div>
            <label for="f-tasks">max tasks</label>
            <input type="number" id="f-tasks" value="8" min="1">
          </div>
          <div>
            <label for="f-budget">budget</label>
            <input type="number" id="f-budget" placeholder="∞" min="1">
          </div>
          <div>
            <label for="f-pr" class="checklabel">
              <input type="checkbox" id="f-pr">
              open a PR/MR when the run finishes
            </label>
            <div class="formhint" id="f-pr-hint"></div>
          </div>
          <div>
            <label for="f-atimeout">agent timeout (s)</label>
            <input type="number" id="f-atimeout" value="1800" min="1">
          </div>
          <div>
            <label for="f-ttimeout">test timeout (s)</label>
            <input type="number" id="f-ttimeout" value="900" min="1">
          </div>
        </div>
      </details>
      <div class="startrow">
        <button type="submit" id="f-start">Start run</button>
      </div>
      <div class="formerr" id="f-err"></div>
    </form>

    <h2 style="margin-top:24px">Runs</h2>
    <div class="runlist" id="runlist"></div>
  </aside>

  <section id="detail">
    <div class="empty">select a run to watch its tasks and logs</div>
  </section>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let selectedRun = null;
let selectedStatus = null;     // last observed status of the selected run
let es = null;                 // active EventSource
let live = false;              // is the selected run actively running?
let liveKey = null;            // key of the transcript step currently streaming
let livePre = null;            // <pre> of the step currently streaming
let lastResync = 0;            // throttles SSE error resyncs

async function api(path, opts) {
  const r = await fetch(path, opts);
  let body = null;
  try { body = await r.json(); } catch {}
  if (!r.ok) throw new Error((body && body.error) || r.status);
  return body;
}

function esc(el, text) { el.textContent = text ?? ""; }

function relTime(iso) {
  if (!iso) return "";
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
}

function fmtDur(x) {
  if (x == null) return "";
  if (x < 60) return x.toFixed(1) + "s";
  return Math.floor(x / 60) + "m " + Math.round(x % 60) + "s";
}

const RUNNING_RUN = new Set(["queued", "planning", "running"]);
const RUNNING_TASK = new Set(["implementing", "testing", "pr", "fixing"]);

function pill(status) {
  const s = document.createElement("span");
  s.className = "pill " + (status || "pending");
  s.textContent = status || "pending";
  return s;
}

// ---- runs list ------------------------------------------------------------

async function loadRuns() {
  try {
    const { runs } = await api("/api/runs");
    const list = $("runlist");
    list.innerHTML = "";
    if (!runs.length) {
      const e = document.createElement("div");
      e.className = "nodetail";
      e.textContent = "no runs yet — start one on the left";
      list.appendChild(e);
    }
    for (const r of runs) {
      const item = document.createElement("div");
      item.className = "runitem" + (r.id === selectedRun ? " active" : "");
      const top = document.createElement("div");
      top.className = "top";
      top.appendChild(pill(r.status));
      const p = document.createElement("span");
      p.className = "prompt";
      esc(p, r.prompt);
      top.appendChild(p);
      const meta = document.createElement("div");
      meta.className = "meta";
      const m1 = document.createElement("span"); esc(m1, r.repo);
      const m2 = document.createElement("span"); esc(m2, r.n_done + "/" + r.n_tasks + " tasks");
      const m3 = document.createElement("span"); esc(m3, relTime(r.created_at));
      const m4 = document.createElement("span"); esc(m4, "#" + r.id);
      meta.append(m1, m2, m3, m4);
      item.append(top, meta);
      item.onclick = () => selectRun(r.id);
      list.appendChild(item);
    }
  } catch (e) { /* server briefly unavailable; retry next poll */ }
}

// ---- run detail -----------------------------------------------------------

async function selectRun(id) {
  selectedRun = id;
  const data = await api("/api/runs/" + id);
  selectedStatus = data.status;
  renderRun(data);
  // Rebuild the transcript from the persisted history (this is what makes
  // the output survive a page reload), then stream new lines on top.
  let steps = [];
  try { steps = (await api("/api/runs/" + id + "/transcript")).steps; }
  catch { /* no transcript yet (or server hiccup) */ }
  renderTranscript(steps, !!data.running);
  if (data.running) {
    setLive(true);
    openSSE(id);
  } else {
    setLive(false);
    if (es) { es.close(); es = null; }
  }
  loadRuns();
}

function setLive(on) {
  live = on;
  document.body.classList.toggle("live", on);
}

function renderRun(data) {
  const d = $("detail");
  d.innerHTML = "";

  // header
  const head = document.createElement("div");
  head.className = "runhead";
  const top = document.createElement("div");
  top.className = "top";
  top.appendChild(pill(data.status));
  const idl = document.createElement("span");
  idl.className = "meta"; esc(idl, "run #" + data.id);
  top.appendChild(idl);
  if (data.running) {
    const b = document.createElement("button");
    b.className = "danger"; b.textContent = "Cancel";
    b.onclick = async () => {
      b.disabled = true;
      try { await api(`/api/runs/${data.id}/cancel`, { method: "POST" }); }
      catch (e) { b.disabled = false; alert(e.message); }
    };
    top.appendChild(b);
  }
  const p = document.createElement("div");
  p.className = "prompt"; esc(p, data.prompt);
  const meta = document.createElement("div");
  meta.className = "meta";
  const P = data.params || {};
  for (const [k, v] of [
    ["repo", data.repo], ["base", P.base || data.base_branch],
    ["agent", P.agent || "pi"], ["model", P.model],
    ["test", data.test_cmd || "(planner)"],
    ["max iter", P.max_iterations], ["created", data.created_at],
    ["finished", data.finished_at],
  ]) {
    if (v == null || v === "") continue;
    const s = document.createElement("span");
    s.textContent = `${k}: ${v}`;
    meta.appendChild(s);
  }
  head.append(top, p, meta);
  if (data.error) {
    const e = document.createElement("div");
    e.className = "error"; esc(e, data.error);
    head.appendChild(e);
  }
  d.appendChild(head);

  // transcript: persisted agent-output history + the live streaming target
  const tr = document.createElement("div");
  tr.id = "transcript";
  tr.className = "transcript";
  tr.style.display = "none";  // shown by renderTranscript once it has steps
  d.appendChild(tr);

  // tasks
  if (data.status === "awaiting_approval") {
    d.appendChild(planReview(data));
  } else {
    if (data.status === "awaiting_acceptance") d.appendChild(diffReview(data.id));
    if (data.status === "accepted" || data.status === "rejected") {
      const e = document.createElement("div");
      e.className = "nodetail";
      e.textContent = data.status === "accepted"
        ? "accepted — staged changes were merged into the base branch"
        : "rejected — the staged changes were discarded";
      d.appendChild(e);
    }
    if (!data.tasks || !data.tasks.length) {
      const e = document.createElement("div");
      e.className = "nodetail";
      e.textContent = data.status === "queued" || data.status === "planning"
        ? "planning tasks…"
        : "no tasks recorded";
      d.appendChild(e);
    }
    for (const t of data.tasks) d.appendChild(taskRow(t));
  }
}

function transcriptBlock(step, live) {
  const el = document.createElement("div");
  el.className = "tstep" + (live ? " live" : "");
  const top = document.createElement("div");
  top.className = "top";
  top.textContent = step.label;
  if (live) {
    const who = document.createElement("span");
    who.className = "who"; esc(who, "streaming…");
    top.appendChild(who);
  }
  const pre = document.createElement("pre");
  esc(pre, step.text);
  el.append(top, pre);
  return el;
}

function renderTranscript(steps, live) {
  const box = $("transcript");
  if (!box) return;
  box.innerHTML = "";
  for (const s of steps) box.appendChild(transcriptBlock(s, false));
  if (live) {
    if (steps.length) {
      // The step streaming right now is the newest one in the history.
      const last = box.lastElementChild;
      last.classList.add("live");
      const who = document.createElement("span");
      who.className = "who"; esc(who, "streaming…");
      last.querySelector(".top").appendChild(who);
      liveKey = steps[steps.length - 1].key;
      livePre = last.querySelector("pre");
      livePre.scrollTop = livePre.scrollHeight;
    } else {
      // Running but nothing persisted yet: waiting placeholder. The first
      // real step replaces it (see the agent_output handler).
      const el = transcriptBlock({ key: "", label: "agent output", text: "" }, true);
      box.appendChild(el);
      liveKey = null;
      livePre = el.querySelector("pre");
      esc(livePre, "waiting for output…");
    }
  } else {
    liveKey = null;
    livePre = null;
  }
  box.style.display = box.children.length ? "" : "none";
}

// ---- diff review / accept / reject -----------------------------------------

function diffReview(id) {
  const wrap = document.createElement("div");
  wrap.className = "diffwrap";

  const title = document.createElement("div");
  title.className = "difftitle";
  title.textContent = "slop-churner finished — review the changes before accepting";
  wrap.appendChild(title);

  const stat = document.createElement("div");
  stat.className = "diffstat";
  esc(stat, "loading diff…");
  wrap.appendChild(stat);

  const files = document.createElement("div");
  wrap.appendChild(files);

  const err = document.createElement("div");
  err.className = "formerr";
  wrap.appendChild(err);

  const row = document.createElement("div");
  row.className = "startrow";
  const accept = document.createElement("button");
  accept.type = "button"; accept.textContent = "Accept — merge into base";
  const reject = document.createElement("button");
  reject.type = "button"; reject.className = "danger"; reject.textContent = "Reject — discard changes";
  row.append(accept, reject);
  wrap.appendChild(row);

  const setBusy = (on) => { accept.disabled = reject.disabled = on; };

  const doAction = async (action) => {
    err.textContent = "";
    setBusy(true);
    try {
      await api(`/api/runs/${id}/${action}`, { method: "POST" });
      await selectRun(id);
    } catch (e) {
      err.textContent = e.message;
      setBusy(false);
    }
  };
  accept.onclick = () => {
    if (confirm("Merge the staged changes into the base branch?\n(This deletes the staging branch.)")) doAction("accept");
  };
  reject.onclick = () => {
    if (confirm("Discard ALL staged changes from this run?\n(This cannot be undone.)")) doAction("discard");
  };

  api(`/api/runs/${id}/diff`).then((d) => {
    stat.textContent = "";
    const n = document.createElement("b");
    n.className = "add"; n.textContent = `+${d.added}`;
    const m = document.createElement("b");
    m.className = "del"; m.textContent = `-${d.deleted}`;
    const s = document.createElement("span");
    esc(s, `  ${d.stat}`);
    stat.append(n, m, s);
    for (const f of d.files) files.appendChild(diffFileRow(f));
    if (!d.files.length) {
      const e = document.createElement("div");
      e.className = "nodetail";
      e.textContent = "no file changes detected";
      files.appendChild(e);
    }
  }).catch((e) => { err.textContent = e.message; });

  return wrap;
}

function diffFileRow(f) {
  const rowEl = document.createElement("div");
  rowEl.className = "diffrow";
  const head = document.createElement("div");
  head.className = "diffhead";
  const chev = document.createElement("span");
  chev.className = "chev"; chev.textContent = "▸";
  const path = document.createElement("span");
  path.className = "path"; esc(path, f.path);
  const add = document.createElement("span");
  add.className = "add"; esc(add, "+" + f.added);
  const del = document.createElement("span");
  del.className = "del"; esc(del, "-" + f.deleted);
  head.append(chev, path, add, del);
  rowEl.appendChild(head);

  const pre = document.createElement("pre");
  pre.className = "diffpatch";
  pre.style.display = "none";
  rowEl.appendChild(pre);

  let loaded = false;
  head.onclick = () => {
    rowEl.classList.toggle("open");
    const open = rowEl.classList.contains("open");
    pre.style.display = open ? "" : "none";
    if (open && !loaded) {
      loaded = true;
      for (const line of (f.patch || "(no patch)").split("\n")) {
        const dl = document.createElement("div");
        dl.className = "dl";
        if (line.startsWith("+")) dl.classList.add("add");
        else if (line.startsWith("-")) dl.classList.add("del");
        else if (line.startsWith("@@")) dl.classList.add("hunk");
        else if (line.startsWith("diff ") || line.startsWith("index ")
              || line.startsWith("new file") || line.startsWith("deleted file")
              || line.startsWith("--- ") || line.startsWith("+++ ")) dl.classList.add("meta");
        esc(dl, line);
        pre.appendChild(dl);
      }
    }
  };
  return rowEl;
}

// ---- plan review / edit / approve ------------------------------------------

function planReview(data) {
  const wrap = document.createElement("div");

  const intro = document.createElement("div");
  intro.className = "nodetail";
  intro.textContent = "slop-churner proposed the plan below — edit, add or remove tasks, then approve to start or reject to cancel.";
  wrap.appendChild(intro);

  const list = document.createElement("div");
  list.className = "planlist";
  wrap.appendChild(list);

  const renumber = () => {
    list.querySelectorAll(".planrow .num").forEach((n, i) => { n.textContent = (i + 1) + "."; });
  };
  const addRow = (t) => {
    const row = document.createElement("div");
    row.className = "planrow";
    const top = document.createElement("div");
    top.className = "top";
    const num = document.createElement("span");
    num.className = "num";
    const ti = document.createElement("input");
    ti.type = "text"; ti.className = "title"; ti.placeholder = "task title";
    ti.value = t ? (t.title || "") : "";
    const rm = document.createElement("button");
    rm.type = "button"; rm.className = "ghost"; rm.textContent = "remove";
    rm.onclick = () => { row.remove(); renumber(); };
    top.append(num, ti, rm);
    const de = document.createElement("textarea");
    de.className = "desc"; de.placeholder = "what should this task accomplish?";
    de.value = t ? (t.description || "") : "";
    row.append(top, de);
    list.appendChild(row);
    renumber();
  };
  (data.tasks || []).forEach(addRow);

  const lc = document.createElement("label");
  lc.textContent = "test cmd";
  const tc = document.createElement("input");
  tc.type = "text"; tc.placeholder = "planner's choice";
  tc.value = data.plan_test_cmd || ((data.params || {}).test_cmd) || "";
  wrap.append(lc, tc);

  const err = document.createElement("div");
  err.className = "formerr";
  wrap.appendChild(err);

  const row = document.createElement("div");
  row.className = "startrow";
  const add = document.createElement("button");
  add.type = "button"; add.className = "ghost"; add.textContent = "Add task";
  add.style.flex = "0";
  add.onclick = () => addRow(null);
  const approve = document.createElement("button");
  approve.type = "button"; approve.textContent = "Approve and start";
  const reject = document.createElement("button");
  reject.type = "button"; reject.className = "danger"; reject.textContent = "Reject";
  row.append(approve, reject, add);
  wrap.appendChild(row);

  const setBusy = (on) => { approve.disabled = reject.disabled = add.disabled = on; };
  const fail = (e) => { err.textContent = e.message; setBusy(false); };

  // initial snapshot for the change-detection (PUT the plan only if edited)
  const initTasks = (data.tasks || []).map((t) => [t.title, t.description]);
  const initTest = data.plan_test_cmd || ((data.params || {}).test_cmd) || "";

  approve.onclick = async () => {
    err.textContent = "";
    const tasks = [...list.querySelectorAll(".planrow")].map((r, i) => ({
      task_id: i + 1,
      title: r.querySelector(".title").value.trim(),
      description: r.querySelector(".desc").value.trim(),
    }));
    const test_cmd = tc.value.trim();
    if (!tasks.length) { err.textContent = "the plan needs at least one task"; return; }
    if (tasks.some((t) => !t.title || !t.description)) {
      err.textContent = "every task needs a title and a description"; return;
    }
    setBusy(true);
    try {
      const same = test_cmd === initTest &&
        JSON.stringify(tasks.map(({ title, description }) => [title, description])) ===
        JSON.stringify(initTasks);
      if (!same) {
        await api(`/api/runs/${data.id}/plan`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ tasks, test_cmd: test_cmd || null }),
        });
      }
      await api(`/api/runs/${data.id}/approve`, { method: "POST" });
      selectRun(data.id);
    } catch (e) { fail(e); }
  };
  reject.onclick = async () => {
    err.textContent = "";
    setBusy(true);
    try {
      await api(`/api/runs/${data.id}/reject`, { method: "POST" });
      selectRun(data.id);
    } catch (e) { fail(e); }
  };
  return wrap;
}

function taskRow(t) {
  const row = document.createElement("div");
  row.className = "taskrow";
  row.dataset.tid = t.task_id;

  const head = document.createElement("div");
  head.className = "taskhead";
  const chev = document.createElement("span");
  chev.className = "chev"; chev.textContent = "▸";
  head.appendChild(chev);
  head.appendChild(pill(t.status));
  const tid = document.createElement("span");
  tid.className = "tid"; esc(tid, "#" + t.task_id);
  const title = document.createElement("span");
  title.className = "title"; esc(title, t.title);
  const iter = document.createElement("span");
  iter.className = "iter"; esc(iter, t.iterations ? `iter ${t.iterations}` : "");
  head.append(tid, title, iter);
  row.appendChild(head);

  if (t.description) {
    const desc = document.createElement("div");
    desc.className = "taskdesc"; esc(desc, t.description);
    row.appendChild(desc);
  }
  if (t.status === "failed" && t.last_error) {
    const err = document.createElement("div");
    err.className = "taskerr"; esc(err, t.last_error);
    row.appendChild(err);
    const rr = document.createElement("div");
    rr.className = "retryrow";
    const b = document.createElement("button");
    b.className = "ghost"; b.textContent = "Retry task";
    b.onclick = async (ev) => {
      ev.stopPropagation();
      b.disabled = true;
      try {
        await api(`/api/runs/${selectedRun}/retry/${t.task_id}`, { method: "POST" });
        selectRun(selectedRun);
      } catch (e) { b.disabled = false; alert(e.message); }
    };
    rr.appendChild(b);
    row.appendChild(rr);
  }

  const steps = document.createElement("div");
  steps.className = "steps";
  steps.style.display = "none";
  row.appendChild(steps);

  let loaded = false;
  head.onclick = async () => {
    row.classList.toggle("open");
    const open = row.classList.contains("open");
    steps.style.display = open ? "" : "none";
    if (open && !loaded) {
      loaded = true;
      steps.innerHTML = "";
      try {
        const { steps: st } = await api(`/api/runs/${selectedRun}/tasks/${t.task_id}`);
        if (!st.length) {
          const e = document.createElement("div");
          e.className = "nodetail";
          e.textContent = "no steps yet";
          steps.appendChild(e);
        } else {
          for (const s of st) steps.appendChild(stepCard(s));
        }
      } catch (e) { alert(e.message); }
    }
  };
  return row;
}

function stepCard(s) {
  const step = document.createElement("div");
  step.className = "step";
  const top = document.createElement("div");
  top.className = "steptop";
  const st = document.createElement("span");
  st.className = "stage"; esc(st, s.stage);
  const it = document.createElement("span");
  it.className = "iter"; esc(it, "iter " + s.iteration);
  top.append(st, it);
  if (s.ok != null) {
    const ok = document.createElement("span");
    ok.className = "ok " + (s.ok ? "pass" : "fail");
    ok.textContent = s.ok ? "✓ pass" : "✗ fail";
    top.appendChild(ok);
  }
  if (s.duration != null) {
    const du = document.createElement("span");
    du.className = "dur"; esc(du, fmtDur(s.duration));
    top.appendChild(du);
  }
  step.appendChild(top);
  if (s.output) {
    const pre = document.createElement("pre");
    pre.className = "log";
    esc(pre, s.output);
    step.appendChild(pre);
  }
  return step;
}

// ---- live updates ---------------------------------------------------------

function openSSE(id) {
  if (es) es.close();
  es = new EventSource(`/api/runs/${id}/events`);
  es.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    const { name, data } = msg;
    if (name === "task_updated") {
      const row = document.querySelector(`.taskrow[data-tid="${data.id}"]`);
      if (row && selectedRun === id) {
        row.replaceWith(taskRow(data));
      }
    } else if (name === "agent_output") {
      if (selectedRun !== id) return;
      const key = data.label || (data.task_id + ":" + data.stage);
      const label = data.label || ("task " + data.task_id + " / " + data.stage);
      const box = $("transcript");
      if (!box) return;
      if (key !== liveKey) {
        // New agent step: end the previous block, start a fresh one.
        const old = box.querySelector(".tstep.live");
        if (old) {
          const oPre = old.querySelector("pre");
          if (oPre && !oPre.textContent.trim()) old.remove();  // placeholder
          else {
            old.classList.remove("live");
            const w = old.querySelector(".who");
            if (w) w.remove();
          }
        }
        box.appendChild(transcriptBlock({ key, label, text: "" }, true));
        box.style.display = "";
        liveKey = key;
        livePre = box.lastElementChild.querySelector("pre");
      }
      if (livePre) {
        // Append the chunk verbatim: pi --mode json streams text deltas
        // (no trailing newline) as well as whole lines, so we must not force
        // a newline per chunk or the transcript fragments.
        livePre.textContent += data.line || "";
        livePre.scrollTop = livePre.scrollHeight;
      }
    } else if (name === "planned") {
      // Planner finished (or the plan was re-saved): the run is now
      // awaiting approval — re-render the detail as a plan review.
      if (selectedRun === id) selectRun(id).catch(() => {});
    } else if (name === "step") {
      const row = document.querySelector(`.taskrow.open[data-tid="${data.task_id}"]`);
      const box = row && row.querySelector(".steps");
      if (box) {
        const nod = box.querySelector(".nodetail");
        if (nod) nod.remove();
        box.appendChild(stepCard(data));
        box.scrollTop = box.scrollHeight;
      }
    } else if (name === "closed" || name === "error" || name === "run_finished") {
      setLive(false);
      liveKey = null;
      livePre = null;
      if (name === "closed" && es) es.close();
      selectRun(id).catch(() => {});
    }
  };
  es.onerror = () => {
    // The stream was dropped (reset, network blip, server restart). The
    // transcript is persisted server-side, so resync from the DB and reopen;
    // throttled so a flapping connection can't hammer the API.
    const now = Date.now();
    if (selectedRun === id && now - lastResync > 3000) {
      lastResync = now;
      selectRun(id).catch(() => {});
    }
  };
}

// ---- new run form ---------------------------------------------------------

$("newrun").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errEl = $("f-err");
  errEl.className = "formerr";
  errEl.textContent = "";
  const val = (id, num) => {
    const v = $(id).value.trim();
    if (v === "") return null;
    return num ? Number(v) : v;
  };
  const body = {
    prompt: $("f-prompt").value,
    repo: val("f-repo") || ".",
    base: val("f-base"),
    agent: val("f-agent") || "pi",
    model: val("f-model"),
    test_cmd: val("f-test"),
    max_iterations: val("f-iter", true),
    max_tasks: val("f-tasks", true),
    budget: val("f-budget", true),
    pr_enabled: $("f-pr").checked,
    agent_timeout: val("f-atimeout", true),
    test_timeout: val("f-ttimeout", true),
  };
  if (!body.prompt.trim()) { errEl.textContent = "prompt is required"; return; }
  const btn = $("f-start");
  btn.disabled = true;
  try {
    const res = await api("/api/runs", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    $("f-prompt").value = "";
    // The server accepts the run but may flag soft problems (e.g. the forge
    // CLI is present but not authenticated) — surface them, don't hide them.
    if (Array.isArray(res.warnings) && res.warnings.length) {
      errEl.className = "formwarn";
      errEl.textContent = res.warnings.join("\n");
    }
    await selectRun(res.run_id);
  } catch (err) {
    errEl.className = "formerr";
    errEl.textContent = err.message;
  } finally {
    btn.disabled = false;
  }
});

// PR/MR availability: ask the server whether gh/glab exist and are
// authenticated, then enable/disable the checkbox and show a hint or warning.
async function loadForgeStatus() {
  const box = $("f-pr");
  const hint = $("f-pr-hint");
  let forges = null;
  try { forges = (await api("/api/forge")).forges; }
  catch { forges = null; }  // /api/forge missing or server hiccup
  if (!Array.isArray(forges) || !forges.some((f) => f.available)) {
    box.disabled = true;
    box.checked = false;
    hint.className = "formhint";
    hint.textContent = "no gh/glab on PATH — PR opening unavailable";
    return;
  }
  box.disabled = false;
  const avail = forges.filter((f) => f.available);
  if (!avail.some((f) => f.authenticated)) {
    const cli = avail[0].name;
    const tip = cli === "gh" ? "gh auth login or set GITHUB_TOKEN"
      : cli === "glab" ? "glab auth login or set GITLAB_TOKEN"
      : `${cli} auth login`;
    hint.className = "formhint formwarn";
    hint.textContent = `${cli} found but no token detected (auth status failed) — the PR step will probably fail; run ${tip}`;
  } else {
    hint.className = "formhint";
    hint.textContent = "";
  }
}

// ---- boot ------------------------------------------------------------------

(async function boot() {
  try {
    const h = await api("/api/health");
    $("dbpath").textContent = h.db;
  } catch {}
  await loadForgeStatus();
  await loadRuns();
  setInterval(() => {
    loadRuns();
    // Keep the detail in sync while the run progresses, so it flips from
    // 'planning tasks…' to the plan review the moment the plan lands.
    // Only re-select on a STATUS change: re-rendering (and re-opening the
    // EventSource) every tick would wipe the live transcript and reset
    // the SSE stream on the server.
    if (!selectedRun) return;
    api("/api/runs/" + selectedRun)
      .then((d) => {
        if (d.status !== selectedStatus) return selectRun(selectedRun);
      })
      .catch(() => {});
  }, 4000);
})();
